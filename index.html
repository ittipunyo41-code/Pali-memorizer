<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Text Blur Memorizer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Thonburi, sans-serif;
      padding: 20px;
      background-color: #f2f2f7;
      color: #1c1c1e;
      margin: 0;
    }
    .container {
      max-width: 850px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    h2 { margin-top: 0; color: #007aff; text-align: center; font-size: 22px; }
    
    textarea {
      width: 100%;
      height: 140px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #c7c7cc;
      font-size: 16px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #007aff; }

    .btn-group {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 120px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    button:active { transform: scale(0.97); }
    
    .btn-main { background-color: #007aff; color: white; }
    .btn-confirm { background-color: #34c759; color: white; }
    .btn-toggle { background-color: #5856d6; color: white; }
    .btn-reselect { background-color: #ff9500; color: white; }
    .btn-clear { background-color: #ff3b30; color: white; }

    /* แถบปรับขนาดตัวอักษร */
    .font-control-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
      font-size: 14px;
      color: #8e8e93;
    }
    .btn-font {
      flex: initial;
      min-width: 36px;
      height: 36px;
      padding: 0;
      background: #e5e5ea;
      color: #1c1c1e;
      border-radius: 8px;
      font-size: 14px;
    }

    /* พื้นที่แสดงผลคำ - ปรับความสูงบรรทัดและขนาดให้อ่านสบายตาขึ้น */
    #displayArea {
      font-size: 18px;
      line-height: 1.85;
      margin-top: 10px;
      padding: 20px;
      background: #fafafa;
      border: 1px solid #e5e5ea;
      border-radius: 12px;
      min-height: 120px;
      word-wrap: break-word;
    }

    /* ปรับแต่งลักษณะคำให้บางลง ไม่หนาหนักตา */
    .word {
      cursor: pointer;
      padding: 1px 4px;
      margin: 1px 1px;
      border-radius: 4px;
      display: inline-block;
      user-select: none;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    /* สถานะไฮไลต์เลือกคำ */
    .mark-blur {
      background-color: #ffe600;
      color: #000000;
      font-weight: 600;
    }

    /* สถานะบังคำ (สีทึบโทนสบายตา) */
    .is-blurred {
      background-color: #3a3a3c;
      color: transparent;
      filter: none;
      border-radius: 4px;
    }

    /* สถานะเฉลย */
    .is-blurred.revealed {
      background-color: #d1f2d9;
      color: #0f5132;
      font-weight: 600;
    }
    
    .instructions {
      font-size: 14px;
      color: #8e8e93;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🔒 Text Blur Memorizer</h2>
  
  <div id="inputSection">
    <textarea id="inputText" placeholder="วางเนื้อหาหรือบทเรียนที่ต้องการท่องจำที่นี่..."></textarea>
    <div class="btn-group">
      <button class="btn-main" onclick="loadText()">นำเข้าข้อความ</button>
    </div>
  </div>

  <div id="practiceSection" style="display: none;">
    <div class="instructions" id="statusTip">💡 แตะเลือกคำที่ต้องการบัง แล้วกด "ตกลง"</div>
    
    <div class="font-control-bar">
      <span>ขนาดอักษร:</span>
      <button class="btn-font" onclick="changeFontSize(-2)">A-</button>
      <button class="btn-font" onclick="changeFontSize(2)">A+</button>
    </div>

    <div id="displayArea"></div>

    <div class="btn-group">
      <button id="btnConfirm" class="btn-confirm" onclick="confirmBlur()">ตกลง (เริ่มบังคำ)</button>
      <button id="btnToggle" class="btn-toggle" onclick="toggleAll()" style="display: none;">แสดงทั้งหมด</button>
      <button id="btnReselect" class="btn-reselect" onclick="reselectWords()" style="display: none;">ปรับเลือกคำใหม่</button>
      <button class="btn-clear" onclick="resetAll()">พิมพ์ข้อความใหม่</button>
    </div>
  </div>
</div>

<script>
  let isPracticeMode = false;
  let isAllRevealed = false;
  let currentFontSize = 18;

  function loadText() {
    const text = document.getElementById('inputText').value.trim();
    if (!text) return alert('กรุณาใส่ข้อความก่อนครับ');

    const displayArea = document.getElementById('displayArea');
    displayArea.innerHTML = '';

    const lines = text.split('\n');
    lines.forEach((line, lineIdx) => {
      const words = line.split(' ');
      words.forEach(word => {
        if (word !== '') {
          const span = document.createElement('span');
          span.className = 'word';
          span.innerText = word;
          span.onclick = () => handleWordClick(span);
          displayArea.appendChild(span);
        }
      });
      if (lineIdx < lines.length - 1) {
        displayArea.appendChild(document.createElement('br'));
      }
    });

    document.getElementById('inputSection').style.display = 'none';
    document.getElementById('practiceSection').style.display = 'block';
    
    document.getElementById('btnConfirm').style.display = 'inline-block';
    document.getElementById('btnToggle').style.display = 'none';
    document.getElementById('btnReselect').style.display = 'none';
    document.getElementById('statusTip').innerText = '💡 แตะเลือกคำที่ต้องการบัง แล้วกด "ตกลง"';
    isPracticeMode = false;
    
    currentFontSize = 18;
    displayArea.style.fontSize = currentFontSize + 'px';
  }

  function changeFontSize(delta) {
    currentFontSize = Math.max(14, Math.min(32, currentFontSize + delta));
    document.getElementById('displayArea').style.fontSize = currentFontSize + 'px';
  }

  function handleWordClick(span) {
    if (!isPracticeMode) {
      span.classList.toggle('mark-blur');
    } else {
      if (span.classList.contains('is-blurred')) {
        span.classList.toggle('revealed');
      }
    }
  }

  function confirmBlur() {
    const markedWords = document.querySelectorAll('.mark-blur');
    if (markedWords.length === 0) {
      return alert('กรุณาแตะเลือกคำที่ต้องการบังอย่างน้อย 1 คำครับ');
    }

    markedWords.forEach(span => {
      span.classList.remove('mark-blur');
      span.classList.add('is-blurred');
    });

    isPracticeMode = true;
    isAllRevealed = false;
    
    document.getElementById('btnConfirm').style.display = 'none';
    document.getElementById('btnToggle').style.display = 'inline-block';
    document.getElementById('btnReselect').style.display = 'inline-block';
    document.getElementById('btnToggle').innerText = 'แสดงทั้งหมด';
    document.getElementById('statusTip').innerText = '💡 แตะที่แถบสีทึบเพื่อเปิดดูเฉลยเฉพาะคำได้';
  }

  function reselectWords() {
    const allWords = document.querySelectorAll('.word');
    allWords.forEach(span => {
      if (span.classList.contains('is-blurred')) {
        span.classList.remove('is-blurred', 'revealed');
        span.classList.add('mark-blur');
      }
    });

    isPracticeMode = false;
    isAllRevealed = false;

    document.getElementById('btnConfirm').style.display = 'inline-block';
    document.getElementById('btnToggle').style.display = 'none';
    document.getElementById('btnReselect').style.display = 'none';
    document.getElementById('statusTip').innerText = '💡 แตะเพื่อเลือกหรือยกเลิกคำที่ต้องการบัง แล้วกด "ตกลง"';
  }

  function toggleAll() {
    const blurredWords = document.querySelectorAll('.is-blurred');
    const toggleBtn = document.getElementById('btnToggle');

    if (!isAllRevealed) {
      blurredWords.forEach(span => span.classList.add('revealed'));
      toggleBtn.innerText = 'ซ่อนทั้งหมด';
      isAllRevealed = true;
    } else {
      blurredWords.forEach(span => span.classList.remove('revealed'));
      toggleBtn.innerText = 'แสดงทั้งหมด';
      isAllRevealed = false;
    }
  }

  function resetAll() {
    document.getElementById('inputText').value = '';
    document.getElementById('displayArea').innerHTML = '';
    document.getElementById('inputSection').style.display = 'block';
    document.getElementById('practiceSection').style.display = 'none';
    isPracticeMode = false;
    isAllRevealed = false;
  }
</script>

</body>
</html>
